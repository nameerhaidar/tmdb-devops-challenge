# GitLab CI/CD Pipeline for TMDB DevOps Challenge
# Target: Azure Container Registry (ACR) & Azure Container Instances (ACI)

stages:
  - lint
  - test
  - build
  - docker_build  
  - cloud_push
  - deploy

# --------------------
# 1. LINT STAGE
# --------------------
lint:
  stage: lint
  image: node:18-alpine
  script:
    - npm ci
    - npm run lint
  only:
    - devops-ci-solution

# --------------------
# 2. TEST STAGE
# --------------------
test:
  stage: test
  image: node:18-alpine
  script:
    - npm ci
    - npm test -- --watchAll=false
  only:
    - devops-ci-solution

# --------------------
# 3. BUILD STAGE (Compiles React app)
# --------------------
build:
  stage: build
  image: node:18-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hr
  only:
    - devops-ci-solution

# --------------------
# 4. DOCKER BUILD (Containerizes with Nginx)
# --------------------
docker_build:
  stage: docker_build
  image: docker:28.0
  services:
    - name: docker:28.0-dind
  script:
    - docker build -t tmdb-app-local .
    # Save image as artifact to ensure bit-for-bit consistency in next stage
    - docker save tmdb-app-local > tmdb-app.tar
  artifacts:
    paths:
      - tmdb-app.tar
    expire_in: 1 hr
  only:
    - devops-ci-solution

# --------------------
# 5. CLOUD PUSH (Uploads to Azure Registry)
# --------------------
cloud_push:
  stage: cloud_push
  image: docker:28.0
  services:
    - name: docker:28.0-dind
  script:
    - docker load < tmdb-app.tar
    # Login using GitLab Masked Variables
    - echo "$REGISTRY_PASSWORD" | docker login $REGISTRY_URL -u "$REGISTRY_USER" --password-stdin
    # Tag with unique SHA for traceability and 'latest' for deployment
    - docker tag tmdb-app-local $REGISTRY_URL/tmdb-app:$CI_COMMIT_SHORT_SHA
    - docker tag tmdb-app-local $REGISTRY_URL/tmdb-app:latest
    - docker push $REGISTRY_URL/tmdb-app:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/tmdb-app:latest
  only:
    - devops-ci-solution

# --------------------
# 6. DEPLOY (Live Cloud Deployment)
# --------------------
deploy_to_azure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  script:
    # Login to Azure using Service Principal
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    
    # Deploy to ACI (Azure Container Instances)
    - |
      az container create \
        --resource-group tmdb-resources \
        --name tmdb-frontend-live \
        --image $REGISTRY_URL/tmdb-app:latest \
        --registry-login-server $REGISTRY_URL \
        --registry-username $REGISTRY_USER \
        --registry-password $REGISTRY_PASSWORD \
        --dns-name-label tmdb-app-$(date +%s) \
        --ports 80 \
        --dns-name-label-scope SubscriptionReuse \
        --restart-policy Always
    
    # Display the final public URL in the logs
    - echo "--------------------------------------------------"
    - echo "DEPLOYMENT SUCCESSFUL"
    - echo "Access your app at:"
    - az container show --resource-group tmdb-resources --name tmdb-frontend-live --query ipAddress.fqdn -o tsv
    - echo "--------------------------------------------------"
  only:
    - devops-ci-solution
  environment:
    name: production