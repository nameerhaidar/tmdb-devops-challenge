# GitLab CI pipeline for tmdb-devops-challenge
# Branch: devops-ci-solution
# Cloud target: Azure (ACR)

stages:
  - lint
  - test
  - build
  - docker

# --------------------
# LINT STAGE
# --------------------
lint:
  stage: lint
  image: node:18-alpine
  script:
    - npm ci
    - npm run lint
  only:
    - devops-ci-solution

# --------------------
# TEST STAGE
# --------------------
test:
  stage: test
  image: node:18-alpine
  script:
    - npm ci
    - npm test -- --watchAll=false
  only:
    - devops-ci-solution

# --------------------
# BUILD STAGE
# --------------------
build:
  stage: build
  image: node:18-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
  only:
    - devops-ci-solution

# --------------------
# DOCKER + AZURE PUSH
# --------------------
docker_build:
  stage: docker
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login $AZURE_REGISTRY -u "$AZURE_USERNAME" -p "$AZURE_PASSWORD"
    - docker build -t $AZURE_REGISTRY/tmdb-app:latest .
    - docker push $AZURE_REGISTRY/tmdb-app:latest
  only:
    - devops-ci-solution