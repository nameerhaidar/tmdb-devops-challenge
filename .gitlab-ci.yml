image: node:18

stages:
  - lint
  - test
  - build
  - docker

cache:
  paths:
    - node_modules/

before_script:
  - npm ci

  lint:
  stage: lint
  script:
    - npm run lint
  only:
    - merge_requests
    - main

test:
  stage: test
  script:
    - npm test -- --watchAll=false
  only:
    - merge_requests
    - main

    build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - build/
  only:
    - merge_requests
    - main

    docker:
  stage: docker
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker build -t tmdb-devops-challenge:latest .
    - docker images
  only:
    - merge_requests
    - main